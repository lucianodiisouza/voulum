name: release-build

# When release-please publishes a GitHub Release, build a Release .app,
# ad-hoc sign it, zip it (preserving the bundle), and attach it to the release.
# The build is NOT notarized — see README for how users open it.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          xcodebuild \
            -project Voulum.xcodeproj \
            -scheme Voulum \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package
        run: |
          APP="build/Build/Products/Release/Voulum.app"
          # Ad-hoc sign so Gatekeeper accepts it once quarantine is cleared.
          codesign --force --deep --sign - \
            --entitlements Sources/Voulum/Voulum.entitlements "$APP"
          ZIP="Voulum-${{ github.event.release.tag_name }}-macos.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
