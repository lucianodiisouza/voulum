name: release-please

# Reads Conventional Commits on main, maintains CHANGELOG.md + the version in
# project.yml, and keeps an open "release PR". Merging that PR tags the commit
# (vX.Y.Z) and publishes a GitHub Release.
#
# The build job runs in the SAME workflow run (gated on release_created) and
# attaches the .dmg. It must live here rather than in a separate
# `on: release` workflow because a release created by the built-in GITHUB_TOKEN
# does not trigger further workflows.
#
# Code signing + notarization are OPTIONAL and automatic: if the Apple secrets
# (see docs/SIGNING.md) are configured, the .app is signed with a Developer ID
# and the .dmg is notarized + stapled. If they are absent, it falls back to
# ad-hoc signing (users clear quarantine manually — see README). So this file is
# safe to run before the Apple Developer account exists.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-dmg:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # True only when a signing certificate secret is present.
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
      # True only when a token for the Homebrew tap repo is present.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release)
        run: |
          # Sparkle compares updates by CFBundleVersion. project.yml pins that to
          # "1", so without this override every release would look identical to
          # Sparkle and no update would ever be offered. Feed it the release
          # version (tag without the leading "v") so 0.3.0 > 0.2.1 as expected.
          VERSION="${TAG#v}"
          xcodebuild \
            -project Voulum.xcodeproj \
            -scheme Voulum \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # --- Signing: Developer ID (if secrets present) ------------------------

      - name: Import Developer ID certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign app (Developer ID)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements Sources/Voulum/Voulum.entitlements \
            --sign "$SIGNING_IDENTITY" \
            "build/Build/Products/Release/Voulum.app"
          codesign --verify --strict --verbose=2 \
            "build/Build/Products/Release/Voulum.app"

      - name: Sign app (ad-hoc fallback)
        if: ${{ env.HAS_CERT != 'true' }}
        run: |
          codesign --force --deep --sign - \
            --entitlements Sources/Voulum/Voulum.entitlements \
            "build/Build/Products/Release/Voulum.app"

      # --- Package -----------------------------------------------------------

      - name: Package .dmg
        run: |
          APP="build/Build/Products/Release/Voulum.app"
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="Voulum-${TAG}-macos.dmg"
          hdiutil create -volname "Voulum" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # --- Notarize (if secrets present) -------------------------------------

      - name: Notarize & staple
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      # --- Upload ------------------------------------------------------------

      - name: Attach .dmg to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$DMG" --clobber

      # --- Homebrew: bump the cask in the tap (if token present) -------------
      # Copies this repo's canonical Casks/voulum.rb into the tap repo with the
      # new version + the uploaded DMG's sha256. Optional and automatic: skipped
      # until HOMEBREW_TAP_TOKEN and the tap repo exist (see docs/HOMEBREW.md).
      - name: Update Homebrew tap
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-voulum.git" tap
          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
              Casks/voulum.rb > tap/Casks/voulum.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/voulum.rb
          git diff --cached --quiet && { echo "cask already up to date"; exit 0; }
          git commit -m "voulum ${VERSION}"
          git push
      # --- Sparkle auto-update feed ---------------------------------------
      # Signs the .dmg with the EdDSA private key and (re)builds appcast.xml,
      # the RSS feed the running app polls (SUFeedURL in Info.plist). Skipped
      # automatically until the signing secret is configured, so releases keep
      # working before auto-update is switched on. See docs/UPDATES.md.
      - name: Generate signed appcast
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SPARKLE_VERSION=2.6.4
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle

          # generate_appcast reads the version out of the .app inside each
          # archive, so it only needs a folder of DMGs to work from.
          mkdir -p updates
          cp "$DMG" updates/
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle_ed_key
          sparkle/bin/generate_appcast \
            --ed-key-file sparkle_ed_key \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${TAG}/" \
            updates
          rm -f sparkle_ed_key

          gh release upload "$TAG" updates/appcast.xml --clobber
