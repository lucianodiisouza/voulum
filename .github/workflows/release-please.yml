name: release-please

# Reads Conventional Commits on main, maintains CHANGELOG.md + the version in
# project.yml, and keeps an open "release PR". Merging that PR tags the commit
# (vX.Y.Z) and publishes a GitHub Release — which in turn triggers
# release-build.yml to attach the built .app.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
