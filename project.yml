name: Voulum
options:
  bundleIdPrefix: dev.oprimo
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    MARKETING_VERSION: "0.5.1" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode: Core Audio C callbacks are painful under Swift 6
    # strict concurrency. Revisit once the audio plumbing is stable.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Voulum:
    type: application
    platform: macOS
    sources:
      - path: Sources/Voulum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oprimo.voulum
        PRODUCT_NAME: Voulum
        INFOPLIST_FILE: Sources/Voulum/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Voulum/Voulum.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        # AppIcon.icon (Icon Composer): Liquid Glass on macOS 26, with flat
        # fallbacks compiled in for older systems.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
